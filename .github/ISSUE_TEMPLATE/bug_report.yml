name: Bug report
description: Report a reproducible software defect in GuidelineOps-CN.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, uv version, and database configuration.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use only synthetic or legally redistributable metadata.
    validations:
      required: true
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I have not included paywalled full text, patient data, credentials, or confidential institutional information.
          required: true
