name: Documentation improvement
description: Report unclear, missing, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Documentation language
      options:
        - English
        - Chinese
        - Both
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is confusing or incorrect?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I have not included paywalled full text, patient data, credentials, or confidential institutional information.
          required: true
