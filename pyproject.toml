[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guidelineops-cn"
version = "0.1.0"
description = "Evidence-oriented guideline operations for research and education."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2.0,<3.0",
    "rapidfuzz>=3.0,<4.0",
]

[project.scripts]
guidelineops = "guidelineops.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["guidelineops"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
